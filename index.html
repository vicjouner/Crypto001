<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="index, follow">
<meta name="referrer" content="no-referrer">
<title>Crypto RSI Heatmap — Buy / Sell Pressure + Delta</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#12161f; --line:#1e2530; --txt:#e6edf3; --sub:#8b98a9;
    --ob:#e5484d;      /* overbought */
    --strong:#8a2d34;  /* strong */
    --neutral:#3a4250; /* neutral */
    --weak:#1f5b52;    /* weak */
    --os:#2bb39a;      /* oversold */
    --buy:#26d97f; --sell:#ff4d5e;
    --strongbuy:#00ff88; --strongsell:#ff2952;
    --weak-conf:#eab308; --wait:#6b7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);flex-wrap:wrap;}
  header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
  header h1 span{color:var(--sell);}
  .ctrl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);}
  select,button{background:#1a2029;color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;outline:none;}
  button:hover,select:hover{border-color:#3a4553;}
  button.go{background:#1f6feb;border-color:#1f6feb;font-weight:600;}
  button.go:hover{background:#2f7ffb;}
  .legend{display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap;font-size:12px;}
  .legend .it{display:flex;align-items:center;gap:5px;color:var(--sub);}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;}
  #status{font-size:12px;color:var(--sub);min-width:120px;}
  #wrap{position:relative;flex:1;min-height:0;}
  canvas{display:block;width:100%;height:100%;}
  #tip{position:absolute;pointer-events:none;background:#0d1117ee;border:1px solid #30363d;
    border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.55;z-index:20;display:none;
    box-shadow:0 8px 28px #000a;min-width:180px;}
  #tip b{font-size:13px;}
  #tip .row{display:flex;justify-content:space-between;gap:16px;}
  #tip .k{color:var(--sub);}
  .pos{color:var(--buy);} .neg{color:var(--sell);}
  #side{position:absolute;top:0;right:0;width:250px;height:100%;background:#0d111799;
    border-left:1px solid var(--line);overflow-y:auto;font-size:12px;backdrop-filter:blur(3px);
    transition:transform .2s;}
  #side.hidden{transform:translateX(100%);}
  #side h3{margin:0;padding:8px 12px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line);
    position:sticky;top:0;background:#0d1117;display:flex;justify-content:space-between;}
  .rowitem{display:flex;justify-content:space-between;padding:5px 12px;border-bottom:1px solid #161b22;cursor:default;gap:6px;align-items:center;}
  .rowitem:hover{background:#161b22;}
  .rowitem .sym{font-weight:600;}
  .rowitem .rsi{font-variant-numeric:tabular-nums;}
  .toggleSide{position:absolute;top:8px;right:8px;z-index:25;}
  .zonelabel{position:absolute;right:16px;font-size:13px;font-weight:800;letter-spacing:2px;
    opacity:.5;pointer-events:none;}

  /* 📊 Tooltip prediction / direction block */
  #tip .pred-block{margin-top:6px;padding-top:6px;border-top:1px solid #30363d;}
  #tip .pred-title{font-weight:800;font-size:12px;color:#e6edf3;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;}
  #tip .pred-arrow{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:1px;}
  #tip .pred-hint{font-size:10.5px;color:#c9d1d9;margin-bottom:5px;font-style:italic;line-height:1.3;}
  #tip .pred-row{display:flex;justify-content:space-between;font-size:10.5px;line-height:1.5;color:#8b98a9;}
  #tip .pred-row .ok  { color:#26d97f; font-weight:700; }
  #tip .pred-row .no  { color:#ff4d5e; font-weight:700; }
  #tip .pred-row .neu { color:#8b98a9; }

  /* Buy/Sell volume mini bar */
  #tip .vbar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:4px;background:#30363d;}
  #tip .vbar .b{background:#26d97f;} #tip .vbar .s{background:#ff4d5e;}
</style>
<style>
/* ---- protection layer (additive; does not touch the original styles) ---- */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
*{-webkit-user-drag:none;}
::selection{background:transparent;color:inherit;}
#__wm{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:40;pointer-events:none;
  font-size:10px;letter-spacing:.6px;color:#8b98a9;opacity:.35;white-space:nowrap;}
@media print{ html,body{display:none!important;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Crypto RSI Heatmap <span>· Buy / Sell + Delta</span></h1>
    <div class="ctrl">TF
      <select id="tf">
        <option value="15m">15m</option>
        <option value="1h" selected>1h</option>
        <option value="4h">4h</option>
        <option value="1d">1d</option>
      </select>
    </div>
    <div class="ctrl">Coins
      <select id="topN">
        <option value="80">Top 80</option>
        <option value="150" selected>Top 150</option>
        <option value="250">Top 250</option>
      </select>
    </div>
    <div class="ctrl">Delta window
      <select id="dw">
        <option value="12">12 candles</option>
        <option value="24" selected>24 candles</option>
        <option value="48">48 candles</option>
      </select>
    </div>
    <button class="go" id="load">↻ Load</button>
    <label class="ctrl"><input type="checkbox" id="live" checked> Live</label>
    <span id="livebadge" style="font-size:12px;font-weight:700;color:#8b98a9;">○ live off</span>
    <div class="legend">
      <span class="it"><i class="dot" style="background:var(--ob)"></i>Overbought</span>
      <span class="it"><i class="dot" style="background:var(--strong)"></i>Strong</span>
      <span class="it"><i class="dot" style="background:var(--neutral)"></i>Neutral</span>
      <span class="it"><i class="dot" style="background:var(--weak)"></i>Weak</span>
      <span class="it"><i class="dot" style="background:var(--os)"></i>Oversold</span>
      <span class="it"><i class="dot" style="background:var(--buy)"></i>+Delta (buying)</span>
      <span class="it"><i class="dot" style="background:var(--sell)"></i>−Delta (selling)</span>
      <span class="it" style="color:#c9d1d9;font-weight:700;">
        <span style="color:#00ff88">↑↑</span>/<span style="color:#26d97f">↑</span>/<span style="color:#8b98a9">→</span>/<span style="color:#ff4d5e">↓</span>/<span style="color:#ff2952">↓↓</span> Direction
      </span>
    </div>
    <div id="status">idle</div>
  </header>
  <div id="wrap">
    <canvas id="cv"></canvas>
    <button class="toggleSide" id="ts">☰ List</button>
    <div id="side">
      <h3><span>Ranked by RSI</span><span id="sortmode">RSI ↓</span></h3>
      <div id="list"></div>
    </div>
    <div id="tip"></div>
  </div>
</div>
